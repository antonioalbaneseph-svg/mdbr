name: Archive official Lisbon conference image

on:
  push:
    paths:
      - .github/workflows/archive-lisbon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official conference artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/events
          tmp="$(mktemp)"
          success=0
          for url in \
            'https://fd.lisboa.ucp.pt/sites/default/files/assets/images/ethics-eu-ai-act-imagemlogos.png' \
            'https://fd.lisboa.ucp.pt/sites/default/files/styles/asset_large/public/assets/images/ethics-eu-ai-act-imagemlogos.png?itok=DiD6XQcR' \
            'https://fd.lisboa.ucp.pt/sites/default/files/assets/images/ethics-eu-ai-act-imagemlogos.png?itok=DiD6XQcR'
          do
            echo "Trying $url"
            if curl -fLsS --retry 2 --connect-timeout 10 --max-time 40 -A 'Mozilla/5.0' -e 'https://fd.lisboa.ucp.pt/news/call-papers-international-conference-ethics-eus-ai-act-2027-28646' "$url" -o "$tmp"; then
              mime="$(file -b --mime-type "$tmp")"
              bytes="$(wc -c < "$tmp")"
              echo "Received $mime ($bytes bytes)"
              if [[ "$mime" == "image/png" ]] && [[ "$bytes" -gt 10000 ]]; then
                cp "$tmp" assets/events/lisbon-2027.png
                file assets/events/lisbon-2027.png
                success=1
                break
              fi
            fi
          done
          if [[ "$success" -ne 1 ]]; then
            echo "::error::Official Lisbon image unavailable; refusing to substitute unrelated art."
            exit 1
          fi
      - name: Commit archived original into MDBR repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/events/lisbon-2027.png
          if ! git diff --cached --quiet; then
            git commit -m 'Archive official Ethics in the EU AI Act 2027 image'
            git push
          fi
