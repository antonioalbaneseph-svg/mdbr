name: Import official Jobless Society Forum artwork
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-jobless-poster.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download confirmed MAST Jobless 2026 banner
        run: |
          python3 - <<'PY2'
          import os, urllib.request
          url='https://www.mast.org/documents/41694/981157/2492x1083_Banner_JSF26+%282%29.jpg/5afa747f-355b-43dd-a74f-7c19122459a1?t=1793188132281'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.mast.org/it_IT/jobless-society-forum-lavoro-intelligente'})
          with urllib.request.urlopen(req,timeout=40) as response:
              data=response.read()
          assert data[:3]==bytes([255,216,255]) and len(data)>20000, f'Invalid banner: {len(data)} bytes / {data[:16]!r}'
          os.makedirs('assets/events',exist_ok=True)
          with open('assets/events/jobless-2026.jpg','wb') as output: output.write(data)
          print('Official Jobless poster downloaded:',len(data),'bytes')
          PY2
      - name: Commit locally hosted official artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/events/jobless-2026.jpg
          git commit -m 'Add official Jobless Society Forum poster from MAST' || exit 0
          git push
