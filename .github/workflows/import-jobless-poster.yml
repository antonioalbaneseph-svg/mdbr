name: Import official Jobless Society Forum 2026 artwork
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-jobless-poster.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified official event image from MAST
        run: |
          cat > /tmp/find_official.py <<'PY'
          import urllib.request, urllib.parse, html, re, os, sys
          from html.parser import HTMLParser
          pages=['https://www.mast.org/it_IT/jobless-society-forum-lavoro-intelligente',
                 'https://www.mast.org/en_US/jobless-society-forum-lavoro-intelligente',
                 'https://fondazionefeltrinelli.it/partecipa/jsf2026/']
          class ImageFinder(HTMLParser):
              def __init__(self): super().__init__(); self.images=[]; self.metas=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='img': self.images.append(a)
                  if tag=='meta': self.metas.append(a)
          def fetch(url):
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; MDBR event image archival)'})
              with urllib.request.urlopen(request,timeout=30) as resp: return resp.read()
          candidates=[]
          for page in pages:
              try:
                  content=fetch(page)
                  print('PAGE',page,'bytes',len(content))
                  parser=ImageFinder();parser.feed(content.decode('utf-8',errors='replace'))
                  for a in parser.images:
                      desc=' '.join([a.get('alt',''),a.get('title',''),a.get('data-title',''),a.get('src',''),a.get('data-src','')])
                      if any(word in desc.lower() for word in ['jobless','intelligente','lavoro_intell']):
                          print('MATCHED IMAGE',repr(a)[:2000])
                          for key in ['data-src','src','data-original','data-lazy-src','srcset']:
                              if a.get(key):
                                  uri=a[key].split(',')[0].strip().split(' ')[0]
                                  candidates.append((page,urllib.parse.urljoin(page,html.unescape(uri)),'image-alt'))
                  for meta in parser.metas:
                      if meta.get('property','') in ['og:image','twitter:image'] or meta.get('name','') == 'twitter:image':
                          uri=meta.get('content','')
                          if uri:
                              print('OG',uri)
                              candidates.append((page,urllib.parse.urljoin(page,html.unescape(uri)),'og'))
                  around=[m.start() for m in re.finditer('Jobless Society Forum',content.decode('utf-8',errors='replace'),re.I)]
                  print('IMAGE COUNT',len(parser.images),'TITLE MATCHES',len(around))
              except Exception as e:print('FAILED PAGE',page,repr(e))
          seen=set()
          for page,url,reason in candidates:
              if url in seen or not url.startswith('https:'):continue
              seen.add(url)
              print('TEST',reason,url)
              try:
                  data=fetch(url)
                  ext=('.jpg' if data.startswith(b'\\xff\\xd8\\xff') else '.png' if data.startswith(b'\\x89PNG') else '.webp' if data[:4]==b'RIFF' and data[8:12]==b'WEBP' else '.gif' if data.startswith(b'GIF8') else '')
                  if len(data) < 8000 or not ext:continue
                  if reason=='og' and 'mast.org' in page and 'jobless' not in url.lower() and '2026' not in url.lower():continue
                  path='assets/events/jobless-2026'+ext
                  os.makedirs('assets/events',exist_ok=True)
                  with open(path,'wb') as f:f.write(data)
                  print('SELECTED',path,len(data),url)
                  with open('/tmp/selected_asset.txt','w') as f:f.write(path)
                  break
              except Exception as e:print('FAILED IMAGE',repr(e))
          if not os.path.exists('/tmp/selected_asset.txt'):
              print('ERROR: No verified valid poster image recovered',file=sys.stderr);sys.exit(1)
          PY
          python3 /tmp/find_official.py
      - name: Commit official image into site
        run: |
          FILE=$(cat /tmp/selected_asset.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Archive official Jobless Society Forum 2026 artwork from MAST' || exit 0
          git push
