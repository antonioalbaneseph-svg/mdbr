name: Import official Jobless Society Forum artwork
on:
  push:
    paths:
      - '.github/workflows/import-jobless-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4 pillow
      - name: Retrieve official artwork
        run: python3 .github/scripts/import_jobless.py
      - name: Commit image and updated event
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/events/jobless-society-forum-2026.jpg
          git commit -m "Use official Jobless Society Forum poster"
          git push
